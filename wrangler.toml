# Deploy with: npm run deploy  (wrangler deploy)
name = "proxy"
main = "worker-v2.js"
compatibility_date = "2025-01-01"

# Keeps the existing custom domain attached when deploying from the CLI.
# If you ever deploy to workers.dev only, remove this block.
routes = [
  { pattern = "px.sadeghpm.ir", custom_domain = true }
]

[observability]
enabled = true

[vars]
# Comma-separated host lists. Empty/omitted = allow all (deny still wins).
# ALLOWED_HOSTS = "telegram.org,*.github.com"
# DENIED_HOSTS = "facebook.com"

# Set to "false" to allow localhost/private targets (NOT recommended).
# BLOCK_PRIVATE_IPS = "true"

# Upstream fetch timeout in milliseconds.
# FETCH_TIMEOUT_MS = "30000"
